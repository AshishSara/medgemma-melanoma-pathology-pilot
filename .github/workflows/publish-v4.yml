name: Publish v4 tested tree

on:
  push:
    branches:
      - agent/v3-constrained-pipeline

permissions:
  contents: write

jobs:
  publish:
    if: github.actor == 'AshishSara'
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: agent/v3-constrained-pipeline
          fetch-depth: 0

      - name: Reconstruct and verify exact tested tree
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/medgemma-v4-publication.tar.gz"
          cat medgemma-v4-publication.tar.gz.part-* > "$bundle"
          printf '%s  %s\n'             'a010f5340b57e5915ec803d86adb1f309a347540e1b4c17dbc7608e64550072a'             "$bundle" | sha256sum -c -
          tar -xzf "$bundle" -C "$GITHUB_WORKSPACE"
          rm -f             "$GITHUB_WORKSPACE/medgemma-v4-publication.tar.gz.part-aa"             "$GITHUB_WORKSPACE/medgemma-v4-publication.tar.gz.part-ab"             "$GITHUB_WORKSPACE/.github/workflows/publish-v4.yml"
          git add -A
          actual_tree="$(git write-tree)"
          test "$actual_tree" = '7bed3cb5ed1922acae834dc3daa1b35823b1d8f6'

      - name: Publish verified tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish v3/v4 pilot and terminal incident'
          git push origin HEAD:agent/v3-constrained-pipeline
