name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check scripts tests

      - name: Test
        run: uv run pytest

      - name: Restore AI-audited formal evidence
        run: |
          (
            cd results/bundles
            sha256sum -c formal-results-32f1453e-reviewed.sha256
          )
          tar -xzf results/bundles/formal-results-32f1453e-reviewed.tgz

      - name: Regenerate and validate the synthetic corpus
        run: |
          uv run python scripts/generate_reports.py
          uv run python scripts/validate_artifacts.py
          git diff --exit-code -- data output
