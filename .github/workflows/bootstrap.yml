      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev

      - name: Generate and evaluate not-run ledgers
        run: |
          uv run python scripts/generate_reports.py
          uv run python scripts/evaluate.py

      - name: Validate generated corpus
        run: uv run python scripts/validate_artifacts.py

      - name: Run tests
        run: uv run pytest

      - name: Run lint
        run: uv run ruff check scripts tests

      - name: Publish generated repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add reproducible MedGemma melanoma pathology pilot"
          git push
